# The iPhone app that approves Chrome Relay requests with Face ID. `xcodegen` makes Approve.xcodeproj from this.
name: Approve
options:
  bundleIdPrefix: dev.chromerelay
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${CHROME_RELAY_IOS_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Approve:
    type: application
    platform: iOS
    sources: [Approve/Sources, Approve/Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${CHROME_RELAY_IOS_BUNDLE_ID}
        PRODUCT_NAME: Chrome Relay Approve
        INFOPLIST_KEY_CFBundleDisplayName: Relay Approve
        INFOPLIST_KEY_NSFaceIDUsageDescription: Face ID approves your agents' Chrome Relay requests, and signs each approval.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ${CHROME_RELAY_IOS_ENTITLEMENTS}
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Approve/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: chromerelay
            CFBundleURLSchemes: [chromerelay]
