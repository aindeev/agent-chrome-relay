name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check relay/relay.mjs
          node --check extension/sw.js
          python3 -m py_compile bin/chrome-relay
          python3 -c "import json; json.load(open('extension/manifest.json'))"
      - name: Tests (who may connect, audit trail)
        working-directory: relay
        run: |
          npm ci
          npm test
